<!DOCTYPE html>

<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Foto Saya</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 30px;

        background:
            radial-gradient(circle at top left, #ffffff, transparent 40%),
            linear-gradient(135deg, #e0e7ff, #f8fafc, #dbeafe);

        font-family: Arial, sans-serif;
    }

    .container {
        width: 100%;
        max-width: 1000px;

        display: flex;
        justify-content: center;
        align-items: center;

        padding: 20px;

        background: rgba(255, 255, 255, 0.55);
        border: 1px solid rgba(255, 255, 255, 0.8);

        border-radius: 24px;

        box-shadow:
            0 20px 50px rgba(0, 0, 0, 0.15);

        backdrop-filter: blur(10px);
    }

    .container img {
        display: block;

        max-width: 100%;
        max-height: 85vh;

        width: auto;
        height: auto;

        object-fit: contain;

        border-radius: 16px;

        box-shadow:
            0 10px 30px rgba(0, 0, 0, 0.18);

        transition: transform 0.3s ease;
    }

    .container img:hover {
        transform: scale(1.01);
    }

    @media (max-width: 600px) {
        body {
            padding: 15px;
        }

        .container {
            padding: 10px;
            border-radius: 18px;
        }

        .container img {
            max-height: 90vh;
            border-radius: 12px;
        }
    }
</style>

</head>

<body>

<div class="container">
    <img src="foto.jpeg" alt="Foto">
</div>

</body>
</html>
